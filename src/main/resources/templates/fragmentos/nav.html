<th:block th:fragment="menu-navegacion">
	<div class="col-md-3 left_col">
		<div class="left_col scroll-view">

			<div class="navbar nav_title" style="border: 0;">
				<a th:href="@{/}" class="site_title" style="font-size: 18px; font-weight: 600; letter-spacing: 1px;">
					IPN - Tickets
				</a>
			</div>

			<div class="clearfix"></div>

			<!-- menu profile quick info -->
			<div class="profile clearfix">
				<div class="profile_pic">
					<img th:src="@{/assets/img/icons/user.png}" alt="" class="img-circle profile_img">
				</div>
				<div class="profile_info">
					<span>BIENVENIDO</span>

					<h2>
						<span th:if="${session.usuario != null}" sec:authorize="isAuthenticated()" class="text-light"
							th:text="${session.usuario.d_v_nombre}"></span>&nbsp;
					</h2>

				</div>
			</div>
			<!-- /menu profile quick info -->

			<br />

			<!-- sidebar menu -->
			<div id="sidebar-menu" class="main_menu_side hidden-print main_menu">
				<div class="menu_section">
					<!--
					<h3>General</h3>
					-->
					<ul class="nav side-menu">
						<li sec:authorize="hasAnyAuthority('PANEL', 'ADMIN')">
							<a th:href="@{/ordenes/crear}">
								<i class="fa fa-plus"></i>&nbsp;&nbsp;Nuevo Ticket
							</a>
						</li>
						<!--
						<li sec:authorize="hasAnyAuthority('PANEL', 'STAFF', 'ADMIN')">
							<a th:href="@{/ordenes/mistickets}">
								<i class="fa fa-search"></i>&nbsp;&nbsp;Mis Tickets
							</a>
						</li>
						-->
						<li sec:authorize="hasAnyAuthority('PANEL', 'STAFF', 'ADMIN')">
							<a th:href="@{/ordenes/mistickets}">
								<i class="fa fa-search"></i>&nbsp;&nbsp;Mis Tickets
								<span th:if="${ticketsAsignados > 0}">
									( <span th:text="${ticketsAsignados}"></span> )
								</span>
							</a>
						</li>

						<li sec:authorize="hasAnyAuthority('PANEL', 'STAFF', 'ADMIN')">
							<a th:href="@{/ordenes/mostrar}">
								<i class="fa fa-file"></i>&nbsp;&nbsp;Consultas
							</a>
						</li>
						<!--
						<li sec:authorize="hasAnyAuthority('ADMIN','STAFF')">
							<a>
								<i sec:authorize="hasAnyAuthority('ADMIN','STAFF')"
									class="fa fa-users"></i>&nbsp;&nbsp;Administración <span
									class="fa fa-chevron-down"></span>
							</a>
							<ul class="nav child_menu">
								<li sec:authorize="hasAnyAuthority('ADMIN')">
									<a th:href="@{/usuarios/lista}">
										<i class="fa fa-user"></i>&nbsp;&nbsp;Usuarios
									</a>
								</li>
								<li sec:authorize="hasAnyAuthority('ADMIN','STAFF')">
								    <a th:href="@{/usuarios/lista}">
								        <i class="fa fa-sitemap"></i>&nbsp;&nbsp;Áreas
								    </a>
								</li>
							</ul>
						</li>
						-->
					</ul>
				</div>
			</div>
			<!-- /sidebar menu -->
		</div>
	</div>

	<!-- top navigation -->
	<div class="top_nav">
		<div class="nav_menu">
			<div class="nav toggle">
				<a id="menu_toggle"><i class="fa fa-bars"></i></a>
			</div>
			<nav class="nav navbar-nav">
				<ul class="navbar-right">
					<li class="nav-item dropdown open" style="padding-left: 15px;">
						<a href="javascript:;" class="user-profile dropdown-toggle" aria-haspopup="true"
							id="navbarDropdown" data-toggle="dropdown" aria-expanded="false">
							<i class="fa fa-user-circle-o"></i>&nbsp;
							<span th:text="${session.usuario.d_v_nombre}"></span>
						</a>
						<div class="dropdown-menu dropdown-usermenu pull-right" aria-labelledby="navbarDropdown">
							<!--
							<a class="dropdown-item" th:href="@{/assets/doc/instructivo.pdf}"
								download="Instructivo_Tickets.pdf">
								<i class="fa fa-download pull-right"></i>
								Instructivo
							</a>
							-->
							<a class="dropdown-item" th:href="@{/logout}"><i class="fa fa-sign-out pull-right"></i>
								Cerrar Sesión</a>
						</div>
					</li>
				</ul>
			</nav>
		</div>
	</div>
	<!-- /top navigation -->
</th:block>
