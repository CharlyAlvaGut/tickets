<script>
	//Código JS
	$(document).ready(function () {
		setearFechasPorDefecto();

		var tabla = $('#table1').DataTable({
			"pageLength": 10,
			ordering: false

		});

		$('#formFiltros').on('submit', function (e) {

			const fechaIni = $('#fechaIni').val().trim();
			const fechaFin = $('#fechaFin').val().trim();

			if (!validarRangoFechas(fechaIni, fechaFin)) {
				e.preventDefault();
				return;
			}

			if (!fechaIni && !fechaFin) {
				e.preventDefault();
				$('#formFiltros')[0].submit();

			}
		});

		$('#ticketId').on('change', function () {
			const anioActual = new Date().getFullYear();
			$('#anio').val(anioActual);
		});

		$('#fechaIni').on('change', function () {
			const hoy = new Date();

			const yyyy = hoy.getFullYear();
			const mm = String(hoy.getMonth() + 1).padStart(2, '0');
			const dd = String(hoy.getDate()).padStart(2, '0');

			const fechaActual = `${yyyy}-${mm}-${dd}`;

			$('#fechaFin').val(fechaActual);
		});





		$('#table1').on('click', '.imprimir-ticket', function (e) {
			e.preventDefault();
			var url = $(this).data('url');

			Swal.fire({
				title: '¿Desea imprimir las notas internas?',
				icon: 'question',
				showCancelButton: true,
				confirmButtonColor: '#28a745',
				cancelButtonColor: '#d33',
				confirmButtonText: 'Sí, imprimir',
				cancelButtonText: 'No'
			}).then((result) => {
				let imprimirVal = result.isConfirmed ? 1 : 0;
				let separator = url.includes('?') ? '&' : '?';
				let urlConParametro = url + separator + 'notas=' + imprimirVal;
				window.open(urlConParametro, '_blank');
			});
		});
	});

	function setearFechasPorDefecto() {
		const hoy = new Date();

		const mes = String(hoy.getMonth() + 1).padStart(2, '0');
		const dia = String(hoy.getDate()).padStart(2, '0');
		const anioActual = new Date().getFullYear();
		const fechaHoy = `${anioActual}-${mes}-${dia}`;
		/* Se bloquean fechas futuras y se coloca por defecto la fecha actual en el campo "Fecha Final"
		   A su vez se bloquean fechas anteriores al primer ticket creado, debido a que antes de esa fecha
		   no existen datos que mostrar. 
		*/
		//$('#fechaFin').val(fechaHoy);

		$('#fechaIni').attr('max', fechaHoy);
		$('#fechaFin').attr('max', fechaHoy);
		$('#fechaIni').attr('min', '2025-11-03');
		$('#fechaFin').attr('min', '2025-11-03');
	}



	function validarRangoFechas(fechaIni, fechaFin) {
		const hoy = new Date();
		hoy.setHours(0, 0, 0, 0);

		// Caso 1: solo inicio
		if (fechaIni && !fechaFin) {
			Swal.fire('Falta fecha', 'Ingrese la fecha final', 'warning');
			return false;
		}

		// Caso 2: solo final
		if (!fechaIni && fechaFin) {
			Swal.fire('Falta fecha', 'Ingrese la fecha inicial', 'warning');
			return false;
		}


		if (fechaIni) {
			const fechaIniD = new Date(fechaIni);
			fechaIniD.setHours(0, 0, 0, 0);

			if (fechaIniD > hoy) {
				Swal.fire(
					'Fecha inválida',
					'La fecha inicial debe ser menor o igual a la fecha actual',
					'warning'
				);
				return false;
			}
		}


		if (fechaIni && fechaFin) {
			const fechaIniD = new Date(fechaIni);
			const fechaFinD = new Date(fechaFin);

			if (fechaFinD < fechaIniD) {
				Swal.fire(
					'Rango inválido',
					'La fecha final no puede ser menor a la inicial',
					'error'
				);
				return false;
			}
		}

		// Todo OK
		return true;
	}




</script>
