<div th:replace="fragmentos/top::top"></div>
<!-- page content -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-sans); }
  .dash { display: flex; height: 580px; background: #f5f5f5; border-radius: 12px; overflow: hidden; font-size: 13px; }

  /* Sidebar */
  .sidebar { width: 230px; background: #6B1228; display: flex; flex-direction: column; flex-shrink: 0; }
  .sidebar-profile { padding: 20px 15px 15px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; }
  .avatar-circle { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; flex-shrink: 0; }
  .profile-info span { font-size: 11px; color: rgba(255,255,255,0.5); display: block; text-transform: uppercase; letter-spacing: .5px; }
  .profile-info strong { color: #fff; font-size: 13px; font-weight: 500; }
  .sidebar-menu { padding: 10px 0; flex: 1; overflow-y: auto; }
  .menu-item { display: flex; align-items: center; gap: 10px; padding: 11px 18px; color: rgba(255,255,255,0.75); cursor: pointer; font-size: 13px; transition: background .15s; border-left: 3px solid transparent; }
  .menu-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .menu-item.active { background: rgba(255,255,255,0.12); color: #fff; border-left-color: #C8A951; }
  .menu-item i { font-size: 16px; width: 18px; }
  .menu-badge { margin-left: auto; background: #C8A951; color: #6B1228; font-size: 10px; font-weight: 500; padding: 1px 6px; border-radius: 10px; }
  .menu-submenu { background: rgba(0,0,0,0.15); }
  .menu-submenu .menu-item { padding-left: 46px; font-size: 12px; }
  .sidebar-footer { padding: 12px 18px; border-top: 1px solid rgba(255,255,255,0.1); }
  .logout-btn { display: flex; align-items: center; gap: 8px; color: rgba(255,255,255,0.6); font-size: 12px; cursor: pointer; }
  .logout-btn:hover { color: #fff; }

  /* Main */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* Topbar */
  .topbar { height: 52px; background: #fff; border-bottom: 1px solid #eee; display: flex; align-items: center; padding: 0 20px; gap: 12px; flex-shrink: 0; }
  .menu-toggle { color: #6B1228; font-size: 20px; cursor: pointer; }
  .topbar-title { font-size: 15px; font-weight: 500; color: #333; flex: 1; }
  .topbar-user { display: flex; align-items: center; gap: 8px; color: #555; font-size: 13px; cursor: pointer; }
  .topbar-user i { font-size: 18px; color: #6B1228; }
  .topbar-badge { background: #6B1228; color: #fff; font-size: 10px; padding: 2px 7px; border-radius: 10px; }

  /* Content */
  .content { flex: 1; overflow-y: auto; padding: 20px; }
  .welcome { text-align: center; margin-bottom: 24px; }
  .welcome h2 { font-size: 22px; color: #6B1228; font-weight: 500; margin-bottom: 4px; }
  .welcome p { color: #888; font-size: 13px; }

  /* Stats cards */
  .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .stat-card { background: #fff; border-radius: 8px; padding: 16px; border: 1px solid #eee; display: flex; align-items: center; gap: 12px; }
  .stat-icon { width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
  .stat-icon.guinda { background: rgba(107,18,40,0.1); color: #6B1228; }
  .stat-icon.gold { background: rgba(200,169,81,0.15); color: #a07a1a; }
  .stat-icon.gray { background: #f0f0f0; color: #666; }
  .stat-num { font-size: 24px; font-weight: 500; color: #333; line-height: 1; }
  .stat-label { font-size: 11px; color: #999; margin-top: 2px; }

  /* Logo center */
  .logo-center { display: flex; justify-content: center; margin-top: 8px; }
  .logo-watermark { width: 100px; height: 100px; border-radius: 50%; background: rgba(107,18,40,0.06); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 500; color: rgba(107,18,40,0.25); border: 2px solid rgba(107,18,40,0.08); }

  /* Footer */
  .dash-footer { background: #6B1228; color: rgba(255,255,255,0.7); font-size: 11px; text-align: center; padding: 8px 20px; flex-shrink: 0; }
</style>

		<div class="title_left"></div>
		<br>
		<span class="text-center">
			<h3 style="color: #6B1228;">Bienvenid@</h3>
			<h5 style="color: #6B1228;">ÓRDEN DE SERVICIO</h5>
		</span>

		<div class="d-none d-sm-block text-center">
			<img th:src="@{/assets/img/logo_ipn.png}" class="img-fluid mt-4" style="max-width: 500px; opacity: 0.12;">

		</div>
	</div>
	<div class="stats-grid">
		<div class="stat-card">
			<div class="stat-icon guinda"><i class="ti ti-ticket" aria-hidden="true"></i></div>
			<div>
				<div class="stat-num">12</div>
				<div class="stat-label">Tickets abiertos</div>
			</div>
		</div>
		<div class="stat-card">
			<div class="stat-icon gold"><i class="ti ti-clock" aria-hidden="true"></i></div>
			<div>
				<div class="stat-num">5</div>
				<div class="stat-label">En proceso</div>
			</div>
		</div>
		<div class="stat-card">
			<div class="stat-icon gray"><i class="ti ti-check" aria-hidden="true"></i></div>
			<div>
				<div class="stat-num">38</div>
				<div class="stat-label">Cerrados</div>
			</div>
		</div>
	</div>

	<div class="logo-center">
		<div class="logo-watermark">IPN</div>
	</div>
</div>

<div class="clearfix"></div>

</div>
</div>
